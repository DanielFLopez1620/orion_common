repositories:
  # orion_common is NOT listed here — it is bind-mounted live by devcontainer

  orion_gz:
    type: git
    url: https://github.com/Tesis-ORION/orion_gz.git
    version: dev

  orion_tools:
    type: git
    url: https://github.com/Tesis-ORION/orion_tools.git
    version: dev

  depth_orbbec_astra:
    type: git
    url: https://github.com/Tesis-ORION/depth_orbbec_astra.git
    version: main

  depth_maixsense_a010:
    type: git
    url: https://github.com/Tesis-ORION/depth_maixsense_a010.git
    version: main

  depth_ydlidar_os30a:
    type: git
    url: https://github.com/Tesis-ORION/Depth_ydlidar_os30a.git
    version: main

  # LDRobot LD19 lidar driver (provides ldlidar_component, required by
  # orion_bringup). Carries a libldlidar submodule — post_create.sh initializes
  # it, since vcs import does not.
  ldrobot_lidar_ros2:
    type: git
    url: https://github.com/Myzhar/ldrobot-lidar-ros2.git
    version: main
