# simple_left_arm_controller.yaml
# ForwardCommandController for the ORION left arm servo (servo_conn_1_joint).
# Sends position commands (radians) directly to the ForwardOrion hardware interface.

simple_left_arm_controller:
  ros__parameters:
    type: forward_command_controller/ForwardCommandController
    joints:
      - servo_conn_1_joint
    interface_name: position
    update_rate: 20 # Hz