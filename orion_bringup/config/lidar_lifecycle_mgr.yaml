# lidar_lifecycle_mgr.yaml
# nav2_lifecycle_manager configuration for the LD19 LIDAR node.
# Manages lifecycle transitions (configure/activate) and automatic respawn
# on bond timeout.

/**:
  ros__parameters:
    autostart: True
    node_names: ['ldlidar_node']
    bond_timeout: 5.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0
