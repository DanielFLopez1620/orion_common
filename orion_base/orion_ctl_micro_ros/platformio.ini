; PlatformIO Project Configuration File
; ORION Actuator Control Firmware (ESP32 micro-ROS)
;
; Build options: compiler flags, source filtering
; Upload options: serial port, baud rate, upload protocol
; Library options: dependencies, version constraints
;
; Reference: https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyESP32_1
board_microros_distro = jazzy
board_microros_transport = serial
lib_deps =
	https://github.com/micro-ROS/micro_ros_platformio
	madhephaestus/ESP32Servo@^3.0.6
